name: nightly

# macOS matrix returns when L6 real-CLI smoke lands; until then it would run
# ubuntu only anyway (no macOS-only behavior under test yet).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ci-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: ci:nightly
        run: bun run ci:nightly
